    display: flex; align-items: center; justify-content: center;

<body class="bg-slate-100 text-slate-800 font-sans overflow-hidden">

<!-- ============ TOPBAR ============ -->

const SELECTORS = {

  searchInput: "#searchInput", sgrFilter: "#sgrFilter", siteFilter: "#siteFilter",
  statusBadge: "#statusBadge", statusDot: "#statusDot", statusText: "#statusText"
};

// ========================================================================
// RÈGLE DES COULEURS (5 niveaux + en attente) — identique au dashboard
// ========================================================================
const COLORS = {
  pending:  { hex: "#94a3b8", tw: "bg-slate-400",  text: "text-slate-500", txt: "#0f172a" },
  severe:   { hex: "#b91c1c", tw: "bg-red-700",    text: "text-red-700",   txt: "#ffffff" },
  moderate: { hex: "#ef4444", tw: "bg-red-500",    text: "text-red-600",   txt: "#ffffff" },
  low:      { hex: "#bbf7d0", tw: "bg-green-200",  text: "text-green-700", txt: "#0f172a" },
  good:     { hex: "#22c55e", tw: "bg-green-500",  text: "text-green-600", txt: "#ffffff" },
  strong:   { hex: "#15803d", tw: "bg-green-700",  text: "text-green-700", txt: "#ffffff" }
};

function statutKey(v) {
  if (v === null || v === undefined || isNaN(v)) return "pending";
  if (v > 4)   return "strong";
  if (v >= 1)  return "good";
  if (v >= 0)  return "low";
  if (v >= -2) return "moderate";
  return "severe";
}

// ========================================================================
// ETAT GLOBAL
// ========================================================================
const STATE = {
  map: null, markersLayerGroup: null, markers: {},
  sitesData: {}, geoJsonPoints: null, hasInitialFit: false
};

// ========================================================================
// DONNEES DE SECOURS — 6 sites = 6 niveaux de la légende
// ========================================================================
const MOCK_GEOJSON = {
  type: "FeatureCollection",

    { type: "Feature", geometry: { type: "Point", coordinates: [43.7600, -23.3100] }, properties: {
      site_id: "TAM", code_site: "TAM", site_nom: "Tambalang Nord", secteur: "BTL", tche: "Tovondrana Ariside", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "02/08/2025", duree: "",  txcr_calc: "*",     nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P1", date_pesage: "17/08/2025", duree: "15", txcr_calc: "+4.62", nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P2", date_pesage: "01/09/2025", duree: "15", txcr_calc: "+5.10", nb: 30 }
      ] } },
    { type: "Feature", geometry: { type: "Point", coordinates: [43.6890, -23.3540] }, properties: {
      site_id: "BLM", code_site: "BLM", site_nom: "Ambolimoke", secteur: "ADK", tche: "Hajatiana Arstide", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "01/08/2025", duree: "",  txcr_calc: "*",     nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P1", date_pesage: "16/08/2025", duree: "15", txcr_calc: "+1.56", nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P2", date_pesage: "31/08/2025", duree: "15", txcr_calc: "+0.98", nb: 29 },
        { ligne_test: "LT 2 (Tehake THK5)", pesage: "P0", date_pesage: "01/08/2025", duree: "",  txcr_calc: "*",     nb: 30 },
        { ligne_test: "LT 2 (Tehake THK5)", pesage: "P1", date_pesage: "16/08/2025", duree: "15", txcr_calc: "+1.10", nb: 30 }
      ] } },
    { type: "Feature", geometry: { type: "Point", coordinates: [43.6550, -23.4020] }, properties: {
      site_id: "BVK", code_site: "BVK", site_nom: "Belavenoky", secteur: "BDA", tche: "Franco", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "05/08/2025", duree: "",  txcr_calc: "*",    nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P1", date_pesage: "20/08/2025", duree: "15", txcr_calc: "+0.45", nb: 30 }
      ] } },
    { type: "Feature", geometry: { type: "Point", coordinates: [43.6720, -23.3810] }, properties: {
      site_id: "APL", code_site: "APL", site_nom: "Ampasilava", secteur: "ADK", tche: "Bonhôte", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "03/08/2025", duree: "",  txcr_calc: "*",     nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P1", date_pesage: "18/08/2025", duree: "15", txcr_calc: "-0.42", nb: 29 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P2", date_pesage: "02/09/2025", duree: "15", txcr_calc: "-0.15", nb: 29 }
      ] } },
    { type: "Feature", geometry: { type: "Point", coordinates: [43.7180, -23.3900] }, properties: {
      site_id: "TSM", code_site: "TSM", site_nom: "Antsatsamoroy", secteur: "MKN", tche: "Sandrine", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "03/08/2025", duree: "",  txcr_calc: "*",     nb: 30 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P1", date_pesage: "18/08/2025", duree: "15", txcr_calc: "-2.40", nb: 28 },
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P2", date_pesage: "02/09/2025", duree: "15", txcr_calc: "-1.80", nb: 27 }
      ] } },
    { type: "Feature", geometry: { type: "Point", coordinates: [43.7010, -23.3650] }, properties: {
      site_id: "TSG", code_site: "TSG", site_nom: "Tserananangy", secteur: "MKN", tche: "TOVO Irène Julie", tehake: "THK5",
      rows: [
        { ligne_test: "LT 1 (Tehake THK5)", pesage: "P0", date_pesage: "07/08/2025", duree: "", txcr_calc: "*", nb: 30 }
      ] } }
  ]
};

// ========================================================================
// HELPERS
// ========================================================================
function setStatus(isLive, text) {
  const badge = document.querySelector(SELECTORS.statusBadge);
  const dot = document.querySelector(SELECTORS.statusDot);
  const label = document.querySelector(SELECTORS.statusText);
  badge?.classList.remove("hidden");
  if (label) label.textContent = text;
  if (dot) dot.className = "w-2 h-2 rounded-full " + (isLive ? "bg-emerald-500" : "bg-amber-500");
}

function parseTxcr(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === "*") return null;
  const n = parseFloat(s.replace(",", "."));
  return isNaN(n) ? null : n;
}

function parseFrDate(s) {
  let m = String(s || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = String(s || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

function shortDate(d) {
  return d ? `${("0" + d.getDate()).slice(-2)}/${("0" + (d.getMonth() + 1)).slice(-2)}` : "—";
}

function pesageShort(p) {
  return String(p || "").split("—")[0].trim() || "P?";
}

// ========================================================================
// CHARGEMENT DES DONNEES
// ========================================================================
async function loadData(strict) {
  if (!CONFIG.API_URL.startsWith("http")) {
    if (strict) throw new Error("API_URL non configurée");
    console.warn("API_URL non configurée — mode démo");
    setStatus(false, "Mode démo (données fictives)");
    return MOCK_GEOJSON;
  }
  try {
    const res = await fetch(CONFIG.API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const geo = await res.json();
    if (geo.error) throw new Error(geo.error);
    if (!geo.features || !geo.features.length) throw new Error("Aucune donnée renvoyée");
    if (geo.excluded && geo.excluded.length)
      console.warn("Sites ignorés (absents du GeoJSON) :", geo.excluded.join(", "));
    setStatus(true, "Données en direct");
    return geo;
  } catch (err) {
    if (strict) throw err;
    console.warn("API indisponible, mode démo :", err.message);
    setStatus(false, "Mode démo (données fictives)");
    return MOCK_GEOJSON;
  }
}

function ingest(geo) {
  STATE.geoJsonPoints = geo;
  STATE.sitesData = {};
  geo.features.forEach(f => {
    const p = f.properties;
    p.sgrMoyen = computeSgrMoyen(p.rows || []);
    STATE.sitesData[p.site_id] = p;
  });
}

// ========================================================================
// CALCULS
// ========================================================================
function computeSgrMoyen(rows) {
  const values = rows.map(r => parseTxcr(r.txcr_calc)).filter(v => v !== null);
  if (values.length === 0) return null;
  return values.reduce((a, b) => a + b, 0) / values.length;
}

function buildLineTables(rows) {
  const byLine = rows.reduce((acc, row) => {
    (acc[row.ligne_test] = acc[row.ligne_test] || []).push(row);
    return acc;
  }, {});

  const lineNames = Object.keys(byLine)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  return lineNames.map(lineName => {
    const sorted = byLine[lineName].slice().sort((a, b) =>
      (parseFrDate(a.date_pesage)?.getTime() || 0) - (parseFrDate(b.date_pesage)?.getTime() || 0));
    const intervals = [];
    for (let i = 1; i < sorted.length; i++) {
      const prev = sorted[i - 1], curr = sorted[i];
      intervals.push({
        label: `${pesageShort(prev.pesage)} → ${pesageShort(curr.pesage)}`,
        dates: `${shortDate(parseFrDate(prev.date_pesage))} → ${shortDate(parseFrDate(curr.date_pesage))}`,
        duree: curr.duree ? `${curr.duree}j` : "—",
        sgr: curr.txcr_calc,
        boutures: (prev.nb != null && curr.nb != null)
          ? `${prev.nb} → ${curr.nb}`
          : (curr.nb != null ? String(curr.nb) : "—"),
        perte: prev.nb != null && curr.nb != null && curr.nb < prev.nb
      });
    }
    return { lineName, intervals };
  });
}

// ========================================================================
// COULEURS
// ========================================================================
function getColorForSgr(value) {
  const val = typeof value === "string" ? parseTxcr(value) : value;
  return COLORS[statutKey(val)];
}

function getColorClassForSgr(value) {
  if (parseTxcr(value) === null) return "text-slate-400";
  return `${getColorForSgr(value).text} font-semibold`;
}

// ========================================================================
// CARTE
// ========================================================================
function initMap() {
  // ⚠️ On passe l'élément DOM, pas le sélecteur ("#map" ne marche pas avec Leaflet)
  STATE.map = L.map(document.querySelector(SELECTORS.map), { zoomControl: false })
    .setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);

  L.tileLayer(CONFIG.TILE_URL, { attribution: CONFIG.TILE_ATTR, maxZoom: 19 }).addTo(STATE.map);

  L.control.zoom({ position: "topright" }).addTo(STATE.map);
  STATE.markersLayerGroup = L.layerGroup().addTo(STATE.map);
}

function renderMarkers(sitesToShow) {
  STATE.markersLayerGroup.clearLayers();
  STATE.markers = {};
  if (!STATE.geoJsonPoints) return;
  const bounds = [];

  STATE.geoJsonPoints.features.forEach(feature => {
    const siteId = feature.properties.site_id;
    const site = STATE.sitesData[siteId];
    if (!site) return;
    if (sitesToShow && !sitesToShow.has(siteId)) return;

    const [lng, lat] = feature.geometry.coordinates;
    const color = getColorForSgr(site.sgrMoyen);

    const icon = L.divIcon({
      className: "",
      html: `<div class="site-marker" style="width:38px;height:38px;background-color:${color.hex};color:${color.txt}">${siteId}</div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });

    const marker = L.marker([lat, lng], { icon }).addTo(STATE.markersLayerGroup);
    marker.on("click", () => openSidebar(siteId));
    STATE.markers[siteId] = marker;
    bounds.push([lat, lng]);
  });

  if (bounds.length > 0 && !STATE.hasInitialFit) {
    STATE.map.fitBounds(bounds, { padding: CONFIG.MAP_BOUNDS_PADDING });
    STATE.hasInitialFit = true;
  }
}

// ========================================================================
// SIDEBAR
// ========================================================================
function openSidebar(siteId) {
  const site = STATE.sitesData[siteId];
  if (!site) return;

  const $title = document.querySelector(SELECTORS.sidebarTitle);
  const $tehake = document.querySelector(SELECTORS.sidebarTehake);
  const $tche = document.querySelector(SELECTORS.sidebarTche);
  const $badge = document.querySelector(SELECTORS.sidebarBadge);
  const $body = document.querySelector(SELECTORS.sidebarBody);
  const $sidebar = document.querySelector(SELECTORS.sidebar);
  const $overlay = document.querySelector(SELECTORS.sidebarOverlay);

  if ($title) $title.textContent = `${site.code_site} — ${site.site_nom}`;
  if ($tehake) $tehake.textContent = `Tehake : ${site.tehake || "—"} | Secteur : ${site.secteur || "—"}`;
  if ($tche) $tche.textContent = `Technicien (TCHE) : ${site.tche || "—"}`;

  if ($badge) {
    const color = getColorForSgr(site.sgrMoyen);
    $badge.textContent = site.sgrMoyen === null
      ? "En attente"
      : `${site.sgrMoyen > 0 ? "+" : ""}${site.sgrMoyen.toFixed(2)} %/j`;
    $badge.className = `text-sm font-bold px-2.5 py-1 rounded-full ${color.tw} ${color.txt === "#ffffff" ? "text-white" : "text-slate-900"}`;
  }

  if ($body) {
    $body.innerHTML = "";
    const lineTables = buildLineTables(site.rows);

    if (lineTables.length === 0) {
      $body.innerHTML = `<p class="text-sm text-slate-500 italic">Aucune donnée de pesage disponible pour ce site.</p>`;
    }

    lineTables.forEach(lt => {
      const card = document.createElement("div");
      card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4";

      let rowsHtml = "";
      if (lt.intervals.length === 0) {
        rowsHtml = `<tr><td colspan="5" class="text-xs text-slate-500 italic py-2">En attente de la prochaine pesée</td></tr>`;
      } else {
        rowsHtml = lt.intervals.map(iv => `
          <tr class="border-t border-slate-200">
            <td class="py-2 pr-2 text-slate-700 text-xs">${iv.label}</td>
            <td class="py-2 pr-2 text-slate-500 text-xs">${iv.dates}</td>
            <td class="py-2 pr-2 text-slate-500 text-xs">${iv.duree}</td>
            <td class="py-2 pr-2 text-xs ${iv.perte ? "text-amber-600" : "text-slate-500"}">${iv.boutures}</td>
            <td class="py-2 text-xs ${getColorClassForSgr(iv.sgr)}">${iv.sgr === "*" ? "En attente" : iv.sgr}</td>
          </tr>`).join("");
      }

      card.innerHTML = `
        <h3 class="text-cyan-600 font-semibold text-sm mb-2 tracking-wide">Ligne ${lt.lineName}</h3>
        <table class="interval-table text-left">
          <colgroup><col style="width:24%"><col style="width:22%"><col style="width:10%"><col style="width:16%"><col style="width:28%"></colgroup>
          <thead>
            <tr class="text-[10px] uppercase text-slate-500 tracking-wide">
              <th class="pb-1.5 font-medium">Intervalle</th>
              <th class="pb-1.5 font-medium">Dates</th>
              <th class="pb-1.5 font-medium">Durée</th>
              <th class="pb-1.5 font-medium">Bout.</th>
              <th class="pb-1.5 font-medium">SGR</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;
      $body.appendChild(card);
    });
  }

  $sidebar?.classList.remove("translate-x-full");
  $overlay?.classList.remove("hidden");
}

function closeSidebar() {
  document.querySelector(SELECTORS.sidebar)?.classList.add("translate-x-full");
  document.querySelector(SELECTORS.sidebarOverlay)?.classList.add("hidden");
}

document.querySelector(SELECTORS.closeSidebarBtn)?.addEventListener("click", closeSidebar);
document.querySelector(SELECTORS.sidebarOverlay)?.addEventListener("click", closeSidebar);

// ========================================================================
// FILTRES
// ========================================================================
function populateSiteFilter() {
  const $select = document.querySelector(SELECTORS.siteFilter);
  if (!$select) return;
  Object.keys(STATE.sitesData).sort().forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${code} — ${STATE.sitesData[code].site_nom}`;
    $select.appendChild(opt);
  });
}

function applyFilters() {
  const query = (document.querySelector(SELECTORS.searchInput)?.value || "").trim().toLowerCase();
  const sgrFilterVal = document.querySelector(SELECTORS.sgrFilter)?.value || "all";
  const siteFilterVal = document.querySelector(SELECTORS.siteFilter)?.value || "all";
  const visible = new Set();

  Object.values(STATE.sitesData).forEach(site => {
    let matches = true;
    if (siteFilterVal !== "all" && site.code_site !== siteFilterVal) matches = false;
    if (matches && query) {
      const haystack = `${site.site_nom} ${site.code_site} ${site.tche}`.toLowerCase();
      if (!haystack.includes(query)) matches = false;
    }
    if (matches && sgrFilterVal === "positive" && !(site.sgrMoyen !== null && site.sgrMoyen > 0)) matches = false;
    if (matches && sgrFilterVal === "negative" && !(site.sgrMoyen !== null && site.sgrMoyen < 0)) matches = false;
    if (matches) visible.add(site.code_site);
  });

  renderMarkers(visible);
}

document.querySelector(SELECTORS.searchInput)?.addEventListener("input", applyFilters);
document.querySelector(SELECTORS.sgrFilter)?.addEventListener("change", applyFilters);
document.querySelector(SELECTORS.siteFilter)?.addEventListener("change", applyFilters);

// ========================================================================
// BOOTSTRAP + RAFRAICHISSEMENT AUTO (5 min)
// ========================================================================
async function bootstrap() {
  initMap();
  ingest(await loadData(false));
  populateSiteFilter();
  renderMarkers(null);
}

bootstrap();

setInterval(async () => {
  if (!CONFIG.API_URL.includes("script.google.com")) return;
  try {
    ingest(await loadData(true));
    applyFilters();
  } catch (e) { console.warn("Rafraîchissement échoué :", e.message); }
}, CONFIG.REFRESH_MS);
</script>
</body>
</html>
